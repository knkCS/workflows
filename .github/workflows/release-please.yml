name: Release Please
on:
  workflow_call:
    inputs:
      config-file:   { type: string, default: release-please-config.json }
      manifest-file: { type: string, default: .release-please-manifest.json }
    outputs:
      releases_created:
        value: ${{ jobs.release-please.outputs.releases_created }}
      paths_released:
        value: ${{ jobs.release-please.outputs.paths_released }}
      outputs_json:
        value: ${{ jobs.release-please.outputs.outputs_json }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      paths_released:   ${{ steps.rp.outputs.paths_released }}
      outputs_json:     ${{ toJSON(steps.rp.outputs) }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
