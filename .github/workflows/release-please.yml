name: Release Please
on:
  workflow_call:
    inputs:
      config-file:   { type: string, default: release-please-config.json }
      manifest-file: { type: string, default: .release-please-manifest.json }
    secrets:
      # Optional PAT. When provided, release-please creates the Release PR as
      # that identity, so branch-protection required checks (which do NOT run on
      # GITHUB_TOKEN-created PRs) DO run and the Release PR can merge normally.
      # Falls back to GITHUB_TOKEN when absent (Release PRs then need an admin
      # merge if required checks are enforced).
      CI_TOKEN:
        required: false
    outputs:
      releases_created:
        value: ${{ jobs.release-please.outputs.releases_created }}
      paths_released:
        value: ${{ jobs.release-please.outputs.paths_released }}
      outputs_json:
        value: ${{ jobs.release-please.outputs.outputs_json }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      paths_released:   ${{ steps.rp.outputs.paths_released }}
      outputs_json:     ${{ toJSON(steps.rp.outputs) }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.CI_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
