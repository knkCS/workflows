name: Go Service CI
on:
  workflow_call:
    inputs:
      go-version-file:     { type: string, default: go.mod }
      test-mode:           { type: string, default: testcontainers }  # testcontainers | services
      test-timeout:        { type: string, default: 30m }             # go test -timeout; see the Test steps
      embed-frontend:      { type: boolean, default: false }
      frontend-build:      { type: boolean, default: false }
      ui-package:          { type: string, default: "" }
      ui-lint:             { type: boolean, default: false }          # each UI workspace's own `lint` script
      ui-test:             { type: boolean, default: false }          # each UI workspace's own `test` script
      helm-chart:          { type: string, default: "" }
      node-ci-flags:       { type: string, default: "" }
      npm-github-packages: { type: boolean, default: false }          # write CI_TOKEN into ~/.npmrc so `npm ci` can reach npm.pkg.github.com
      check-ent-drift:     { type: boolean, default: true }
      check-gofmt:         { type: boolean, default: false }          # fail on a tracked Go file that is not gofmt-clean
    secrets:
      CI_TOKEN: { required: true }

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # ui-lint and ui-test run in the `ui` job, which exists only when
      # `ui-package` is set — so on their own they would be silently ignored, and
      # a gate that reports nothing while looking switched on is the exact failure
      # these inputs were added to remove. They therefore REQUIRE `ui-package`
      # rather than implying it: the workflow cannot guess which workspace to run,
      # and a default of "the repo root" is the root-level invocation the UI job's
      # comment explains is worthless. This check lives here because `backend` is
      # the only job that always runs; it needs no checkout, so it fails in seconds.
      - name: Reject UI gates without a UI package
        if: ${{ (inputs.ui-lint || inputs.ui-test) && inputs.ui-package == '' }}
        run: |
          echo "::error::ui-lint/ui-test require ui-package — the UI job only runs when one is set"
          exit 1
      - uses: actions/checkout@v6
      - uses: knkcs/workflows/actions/configure-private-modules@v1
        with:
          ci-token: ${{ secrets.CI_TOKEN }}
      - uses: knkcs/workflows/actions/setup-go-node@v1
        with:
          go-version-file: ${{ inputs.go-version-file }}
          setup-node: ${{ inputs.embed-frontend }}
      - name: Create frontend stub for embed
        if: ${{ inputs.embed-frontend }}
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      - name: Check ent client is up to date
        if: ${{ inputs.check-ent-drift }}
        run: |
          GOWORK=off go generate ./internal/ent
          git diff --quiet -- internal/ent/db || {
            echo "::error::internal/ent/db is stale — run 'make generate-ent' and commit the result";
            git diff --stat -- internal/ent/db; exit 1;
          }
      # Three things below are load-bearing, the first two learned in
      # knkCS/taskhub#34; none survives being "simplified" into a one-liner.
      #
      # `git ls-files`, NOT `gofmt -l .`: gofmt walks EVERYTHING under the path it
      # is handed — dot-directories, node_modules/ and testdata/ included — so
      # `gofmt -l .` reports npm dependencies and, in a checkout carrying agent
      # worktrees under .claude/, other branches' files as this tree's drift.
      #
      # Failing on a NON-ZERO EXIT, not only on a non-empty list, is the gate. On
      # a file it cannot parse, gofmt writes the error to stderr, lists NOTHING on
      # stdout and exits 2 — so a bare `gofmt -l` reads as "clean" and this step
      # goes green on a tree that does not compile, which is the failure it exists
      # to prevent. taskhub shipped that bug once. It also means a tracked file
      # deleted in the working tree fails here rather than being skipped: a loud,
      # accurate report of an index/worktree disagreement.
      #
      # `set -o pipefail` is what makes that true of the WHOLE pipeline. The
      # runner's default shell is `bash -e`, which is not `-o pipefail`, so a
      # pipeline takes the exit status of its LAST command — a failing
      # `git ls-files` would leave xargs succeeding over empty input, and the empty
      # list would read as "clean" again through a different door.
      #
      # Nothing is excluded, generated code included: generated Go is gofmt-clean,
      # so a blanket check costs nothing while an exclusion list is somewhere for
      # real drift to hide. If it ever fires on generated output, regenerate that
      # output — do not hand-format it.
      - name: Check Go files are gofmt-clean
        if: ${{ inputs.check-gofmt }}
        run: |
          set -o pipefail
          if ! unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l); then
            echo "::error::gofmt could not read a tracked Go file — its own error is above"
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: these tracked files are not formatted"
            echo "$unformatted" | sed 's/^/  /'
            printf 'fix with: gofmt -w %s\n' "$(echo "$unformatted" | tr '\n' ' ')"
            exit 1
          fi
      - name: Vet
        run: go vet ./...

  test-testcontainers:
    if: ${{ inputs.test-mode == 'testcontainers' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: knkcs/workflows/actions/configure-private-modules@v1
        with:
          ci-token: ${{ secrets.CI_TOKEN }}
      - uses: knkcs/workflows/actions/setup-go-node@v1
        with:
          go-version-file: ${{ inputs.go-version-file }}
          setup-node: "false"
      - name: Create frontend stub for embed
        if: ${{ inputs.embed-frontend }}
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      # -timeout is explicit because Go's default is 600s PER PACKAGE, and a
      # package that outgrows it fails with a stack dump that reads like a
      # deadlock rather than a slow suite. A green run here is otherwise only
      # evidence that this runner happened to be fast enough — margin, not
      # configuration. Raise `test-timeout` for a slow suite; do not remove it.
      - name: Test
        run: go test -race -cover -timeout ${{ inputs.test-timeout }} ./...

  test-services:
    if: ${{ inputs.test-mode == 'services' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: knkcs/workflows/actions/configure-private-modules@v1
        with:
          ci-token: ${{ secrets.CI_TOKEN }}
      - uses: knkcs/workflows/actions/setup-go-node@v1
        with:
          go-version-file: ${{ inputs.go-version-file }}
          setup-node: "false"
      - name: Create frontend stub for embed
        if: ${{ inputs.embed-frontend }}
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      # -timeout is explicit because Go's default is 600s PER PACKAGE, and a
      # package that outgrows it fails with a stack dump that reads like a
      # deadlock rather than a slow suite. A green run here is otherwise only
      # evidence that this runner happened to be fast enough — margin, not
      # configuration. Raise `test-timeout` for a slow suite; do not remove it.
      - name: Test
        run: go test -race -cover -timeout ${{ inputs.test-timeout }} ./...

  ui:
    if: ${{ inputs.ui-package != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: package-lock.json }
      # GitHub Packages refuses even public-package installs without a token, so
      # a caller whose lockfile pulls anything from npm.pkg.github.com (e.g. the
      # @knkcms scope) 401s on a bare `npm ci`. Opting in writes ONLY the
      # credential, and to the runner's user-level ~/.npmrc — the scope→registry
      # mapping belongs in the caller's committed .npmrc, where the caller
      # decides which scopes resolve to GitHub Packages; without that mapping
      # this token is simply never consulted. Same credential shape knkcms/core's
      # repo-local CI writes. The token reaches the script via `env:` rather than
      # ${{ }} interpolation (publish-ui.yml's pattern for NODE_AUTH_TOKEN):
      # interpolating would paste the secret into the rendered script itself.
      - name: Authenticate npm to GitHub Packages
        if: ${{ inputs.npm-github-packages }}
        run: echo "//npm.pkg.github.com/:_authToken=${CI_TOKEN}" >> ~/.npmrc
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
      - run: npm ci ${{ inputs.node-ci-flags }}
      # Each workspace's OWN `lint` / `test` script, never a root-level
      # `npx biome check .`: a repo whose packages each declare their own
      # biome.json has no root config, and biome aborts on "Found a nested root
      # configuration" having checked nothing — a green step that linted zero
      # files. Calling the package script also keeps ONE definition of what
      # linting or testing a package means, shared with the local `make lint`,
      # so CI and a developer's machine cannot drift apart.
      #
      # The consequence for a caller: opting in REQUIRES the covered workspaces
      # to declare the script. `npm run -w <ws> <script>` fails on a missing one,
      # deliberately — a gate that skips what it cannot find is the gate these
      # inputs replace (knkCS/taskhub#163: a job that built and never tested,
      # while a doc claimed a translation-parity test broke the build).
      #
      # The two gates deliberately cover DIFFERENT workspaces, which is taskhub's
      # split rather than an oversight. Linting is per package — every workspace
      # has a style to hold — so `ui-lint` covers `ui-package` plus `web` when
      # `frontend-build` is on, `frontend-build` being this workflow's existing
      # signal that the repo has an embedded `web` workspace this job owns.
      # Testing is not: the real UI is `ui-package`, an embedded `web` host is a
      # thin shell, and both reference repos reflect that — taskhub's `web` has no
      # `test` script at all, while messengerhub tests its shell in a bespoke job
      # of its own. So `ui-test` covers `ui-package` alone; a repo wanting its
      # shell's suite in CI keeps it beside the shared call, the way messengerhub
      # already keeps `collisions` there.
      #
      # These run before the builds, as taskhub's job does: lint and test are the
      # cheap signals and should not queue behind a Vite build. That assumes a
      # suite resolving the package from SOURCE (both reference repos alias it in
      # their vitest config); a suite needing the built `dist/` is the reason to
      # revisit the order.
      - name: Lint UI package
        if: ${{ inputs.ui-lint }}
        run: npm run -w ${{ inputs.ui-package }} lint
      - name: Lint embedded frontend
        if: ${{ inputs.ui-lint && inputs.frontend-build }}
        run: npm run -w web lint
      - name: Test UI package
        if: ${{ inputs.ui-test }}
        run: npm run -w ${{ inputs.ui-package }} test
      - name: Build UI package
        run: npm run -w ${{ inputs.ui-package }} build
      - name: Build embedded frontend
        if: ${{ inputs.frontend-build }}
        run: npm run -w web build
      - name: Typecheck UI package
        working-directory: ${{ inputs.ui-package }}
        run: npx tsc --noEmit

  helm:
    if: ${{ inputs.helm-chart != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - run: helm lint ${{ inputs.helm-chart }}
