name: Go Service CI
on:
  workflow_call:
    inputs:
      # Which check this run is (see CONTEXT.md): `pr-suite`, the full set a
      # pull request must pass, or `merge-check`, the light compile-level check
      # a caller runs on `push: main` — vet, UI build + typecheck and helm lint
      # in the one `go` job, no tests and no service containers.
      mode:                { type: string, default: pr-suite }        # pr-suite | merge-check
      go-version-file:     { type: string, default: go.mod }
      test-mode:           { type: string, default: testcontainers }  # testcontainers | services
      test-timeout:        { type: string, default: 30m }             # go test -timeout; see the Test steps
      embed-frontend:      { type: boolean, default: false }
      frontend-build:      { type: boolean, default: false }
      ui-package:          { type: string, default: "" }
      ui-lint:             { type: boolean, default: false }          # each UI workspace's own `lint` script
      ui-test:             { type: boolean, default: false }          # each UI workspace's own `test` script
      helm-chart:          { type: string, default: "" }
      node-ci-flags:       { type: string, default: "" }
      npm-github-packages: { type: boolean, default: false }          # write CI_TOKEN into ~/.npmrc so `npm ci` can reach npm.pkg.github.com
      check-ent-drift:     { type: boolean, default: true }
      check-gofmt:         { type: boolean, default: false }          # fail on a tracked Go file that is not gofmt-clean
      # The Go job's runner. A string, so today one label; the default keeps
      # every caller on GitHub-hosted runners until a self-hosted one exists.
      # `services` test mode needs a Linux runner with Docker.
      runs-on:             { type: string, default: ubuntu-latest }
      # Where the Go module lives, relative to the repo root (e.g. `go` for a
      # repo whose go.mod is go/go.mod). Every `run:` step of the Go job runs
      # there; `go-version-file` and `helm-chart` stay root-relative.
      working-directory:   { type: string, default: "." }
      # Job timeouts, so a hang costs minutes rather than GitHub's 6-hour limit.
      # The Go job's 40 sits above the 30m `test-timeout` default, so go test's
      # own timeout (with its stack dump) fires first; raise both together.
      # `changes` and `ci-ok` are fixed at 10.
      test-timeout-minutes: { type: number, default: 40 }
      ui-timeout-minutes:   { type: number, default: 15 }
      # Extra paths that are never docs (whitespace/newline-separated shell
      # globs over the whole path; `*` crosses `/`): repo-specific Markdown that
      # is really an input to code. See scripts/change-areas.sh.
      docs-exclude:        { type: string, default: "" }
      # TEST-ONLY. Replaces the PR's changed-file list (newline-separated) so
      # this repo's self-test can drive the `changes` job with a fixed change
      # set. Inert when empty, which is the default; callers never set it.
      test-changed-files:  { type: string, default: "" }
      # TEST-ONLY. The Vet and UI typecheck steps record their failure without
      # failing the job (step-level continue-on-error), so this repo's
      # self-test can prove the merge check catches a Go compile error and a UI
      # type error while its own run stays green: a failed job is a red check
      # on the PR whatever the caller does with it. Callers never set it.
      test-soft-fail:      { type: boolean, default: false }
    secrets:
      CI_TOKEN: { required: true }

permissions:
  contents: read

jobs:
  # Which change areas (docs, Go, UI, image — see CONTEXT.md) the PR touches.
  # The classifier is scripts/change-areas.sh in THIS repo, fixture-tested by
  # tests/change-areas/run.sh; its header holds the rules. The one to remember:
  # a file in no known area turns on every area, so change detection can only
  # ever run too much, never too little.
  #
  # The file list comes from the compare API (base...head, the same three-dot
  # diff a PR shows), so there is no checkout of the caller and no deep fetch.
  # The compare endpoint needs only `contents: read`, which this workflow
  # already has — the PR-files endpoint would need `pull-requests: read`, and a
  # reusable workflow asking for more than its caller grants fails at startup.
  # A non-PR event (push, dispatch) has no change set and means every area, as
  # does anything the API cannot answer in full. A renamed file contributes
  # both its old and new path: moving internal/x.go to docs/x.md deletes Go.
  #
  # The caller's own layout is passed along: `working-directory` and
  # `helm-chart` count as Go (the `go` job vets, tests and lints them) and
  # `ui-package` as UI, so a module in go/ or a UI package outside packages/
  # does not fall into "no area" and run everything.
  #
  # The `go` job runs when the Go area is on, `ui` when the UI area is; a
  # docs-only PR (`docs-only`, kept for the log) therefore runs neither.
  #
  # In `merge-check` mode every area is on, whatever the event and even with
  # `test-changed-files` set: the merge check is what a caller gates releases
  # on, so no change set may skip it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      go: ${{ steps.classify.outputs.go }}
      ui: ${{ steps.classify.outputs.ui }}
      image: ${{ steps.classify.outputs.image }}
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      # ui-lint and ui-test run in the `ui` job, which exists only when
      # `ui-package` is set — so on their own they would be silently ignored, and
      # a gate that reports nothing while looking switched on is the exact failure
      # these inputs were added to remove. They therefore REQUIRE `ui-package`
      # rather than implying it: the workflow cannot guess which workspace to run,
      # and a default of "the repo root" is the root-level invocation the UI job's
      # comment explains is worthless. This check lives here because `changes`
      # is the one job EVERY run starts with, whatever it touches; it needs no
      # checkout, so it fails in seconds, and ci-ok turns red with it.
      - name: Reject UI gates without a UI package
        if: ${{ (inputs.ui-lint || inputs.ui-test) && inputs.ui-package == '' }}
        run: |
          echo "::error::ui-lint/ui-test require ui-package — the UI job only runs when one is set"
          exit 1
      # An unknown mode would otherwise run as neither: refuse it loudly.
      - name: Reject an unknown mode
        if: ${{ inputs.mode != 'pr-suite' && inputs.mode != 'merge-check' }}
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo "::error::mode must be pr-suite or merge-check, got '${MODE}'"
          exit 1
      # The caller's checkout is not this repo, so the classifier is fetched
      # from the commit this workflow file was resolved from — script and
      # workflow can never skew (argocd-rendering-check.yml's pattern; the
      # fallback ref exists only for contexts that leave the SHA empty).
      - uses: actions/checkout@v6
        with:
          repository: knkcs/workflows
          ref: ${{ job.workflow_sha || 'v1' }}
          path: .knkcs-workflows
          sparse-checkout: scripts
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOCS_EXCLUDE: ${{ inputs.docs-exclude }}
          TEST_CHANGED_FILES: ${{ inputs.test-changed-files }}
          GO_DIR: ${{ inputs.working-directory }}
          HELM_CHART: ${{ inputs.helm-chart }}
          UI_PACKAGE: ${{ inputs.ui-package }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          classify() {
            bash .knkcs-workflows/scripts/change-areas.sh --docs-exclude "$DOCS_EXCLUDE" \
              --go-dir "$GO_DIR" --go-dir "$HELM_CHART" --ui-dir "$UI_PACKAGE"
          }
          every_area() { echo "$1; running every area" >&2; printf 'docs=true\ngo=true\nui=true\nimage=true\n'; }

          if [ "$MODE" = merge-check ]; then
            # The merge check checks the whole tree, whatever the event: it is
            # the release gate, and it must never be skipped by a change set.
            areas=$(every_area "merge check")
          elif [ -n "$TEST_CHANGED_FILES" ]; then
            echo "::notice::test-changed-files is set: classifying a fixed change set, not the PR's"
            areas=$(printf '%s\n' "$TEST_CHANGED_FILES" | classify)
          elif [ "$EVENT" != pull_request ] && [ "$EVENT" != pull_request_target ]; then
            areas=$(every_area "no pull request in context ($EVENT)")
          elif ! compare=$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '{n: (.files | length), files: [.files[] | .filename, (.previous_filename // empty)]}'); then
            echo "::warning::could not list the pull request's changed files"
            areas=$(every_area "no change set")
          elif [ "$(jq '.n' <<<"$compare")" -ge 300 ]; then
            # The compare API lists at most 300 files; a longer list is cut.
            areas=$(every_area "300 or more changed files, the list may be incomplete")
          else
            files=$(jq -r '.files[]' <<<"$compare")
            printf 'changed files:\n%s\n\n' "$files"
            areas=$(printf '%s\n' "$files" | classify)
          fi

          docs_only=true
          if grep -qxE '(go|ui|image)=true' <<<"$areas"; then docs_only=false; fi
          printf '%s\ndocs-only=%s\n' "$areas" "$docs_only" | tee -a "$GITHUB_OUTPUT"

  # The Go job: every Go check of the PR suite on ONE runner, so Go setup and
  # the module download happen once and no tiny job is billed as a whole
  # minute (it folds the former `backend`, `test-testcontainers`,
  # `test-services` and `helm` jobs). The fast checks — ent drift, gofmt, vet,
  # helm lint — run first, so a vet or drift error still fails in about a
  # minute; the tests run last.
  #
  # Runs only when the Go change area changed (a file in no area counts as
  # every area, so it runs then too); a UI-only or docs-only PR skips it.
  #
  # Both test modes are this one job. `services` mode needs Postgres and Redis
  # service containers, and `services:` cannot be switched off with `if:` —
  # but the runner does not start a service whose image is empty ("will not
  # be started because the container definition has an empty image"), so the
  # images are chosen by `test-mode` and testcontainers mode starts none.
  #
  # `working-directory` is where the Go module lives: every `run:` step below
  # runs there (ent drift, gofmt, vet, tests and the embed stub are all
  # module-relative). `go-version-file` and `helm-chart` stay relative to the
  # repository root, as they always were.
  #
  # In `merge-check` mode this job IS the merge check: the same fast Go
  # checks, then — with a `ui-package` — `npm ci`, the UI build and `tsc --noEmit` (a Vite build does not typecheck), and
  # no tests: no Test step and no service containers, whatever `test-mode`
  # says. One job, so one runner and one Go setup. Run on `push: main`, its
  # setup-go and setup-node save the Go module + build cache and the npm cache
  # under the `main` scope on a key miss, which every PR can restore — a PR
  # run can read its base branch's caches, never another PR's. It stays named
  # `go` (the caller's job name says which check it is): a skipped job's
  # `name:` expression is never evaluated, so a mode-dependent name would show
  # raw in the checks list of every PR suite that skips this job.
  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      postgres:
        image: ${{ inputs.mode != 'merge-check' && inputs.test-mode == 'services' && 'postgres:16-alpine' || '' }}
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: ${{ inputs.mode != 'merge-check' && inputs.test-mode == 'services' && 'redis:7-alpine' || '' }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: knkcs/workflows/actions/configure-private-modules@v1
        with:
          ci-token: ${{ secrets.CI_TOKEN }}
      # setup-go directly rather than the setup-go-node action: the module cache
      # is keyed on the module's own go.sum, which is not at the root when
      # `working-directory` is set. No Node — the embed stub below is all a
      # `go:embed` of the frontend needs.
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - name: Create frontend stub for embed
        if: ${{ inputs.embed-frontend }}
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      - name: Check ent client is up to date
        if: ${{ inputs.check-ent-drift }}
        run: |
          GOWORK=off go generate ./internal/ent
          git diff --quiet -- internal/ent/db || {
            echo "::error::internal/ent/db is stale — run 'make generate-ent' and commit the result";
            git diff --stat -- internal/ent/db; exit 1;
          }
      # Three things below are load-bearing, the first two learned in
      # knkCS/taskhub#34; none survives being "simplified" into a one-liner.
      #
      # `git ls-files`, NOT `gofmt -l .`: gofmt walks EVERYTHING under the path it
      # is handed — dot-directories, node_modules/ and testdata/ included — so
      # `gofmt -l .` reports npm dependencies and, in a checkout carrying agent
      # worktrees under .claude/, other branches' files as this tree's drift.
      #
      # Failing on a NON-ZERO EXIT, not only on a non-empty list, is the gate. On
      # a file it cannot parse, gofmt writes the error to stderr, lists NOTHING on
      # stdout and exits 2 — so a bare `gofmt -l` reads as "clean" and this step
      # goes green on a tree that does not compile, which is the failure it exists
      # to prevent. taskhub shipped that bug once. It also means a tracked file
      # deleted in the working tree fails here rather than being skipped: a loud,
      # accurate report of an index/worktree disagreement.
      #
      # `set -o pipefail` is what makes that true of the WHOLE pipeline. The
      # runner's default shell is `bash -e`, which is not `-o pipefail`, so a
      # pipeline takes the exit status of its LAST command — a failing
      # `git ls-files` would leave xargs succeeding over empty input, and the empty
      # list would read as "clean" again through a different door.
      #
      # Nothing is excluded, generated code included: generated Go is gofmt-clean,
      # so a blanket check costs nothing while an exclusion list is somewhere for
      # real drift to hide. If it ever fires on generated output, regenerate that
      # output — do not hand-format it.
      - name: Check Go files are gofmt-clean
        if: ${{ inputs.check-gofmt }}
        run: |
          set -o pipefail
          if ! unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l); then
            echo "::error::gofmt could not read a tracked Go file — its own error is above"
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: these tracked files are not formatted"
            while IFS= read -r f; do echo "  $f"; done <<<"$unformatted"
            printf 'fix with: gofmt -w %s\n' "$(echo "$unformatted" | tr '\n' ' ')"
            exit 1
          fi
      - name: Vet
        continue-on-error: ${{ inputs.test-soft-fail }}
        run: go vet ./...
      - uses: azure/setup-helm@v5
        if: ${{ inputs.helm-chart != '' }}
      - name: Helm lint
        if: ${{ inputs.helm-chart != '' }}
        working-directory: ${{ github.workspace }}
        run: helm lint ${{ inputs.helm-chart }}
      # Merge check only: the `ui` job's build and typecheck, and the setup and
      # `npm ci` they need, on this runner (see the `ui` job for the npm
      # credential). Lint and the UI tests stay PR-suite gates. Same Node
      # version and lockfile as the `ui` job, so the npm cache this saves on
      # `main` has the key that job restores.
      - uses: actions/setup-node@v4
        if: ${{ inputs.mode == 'merge-check' && inputs.ui-package != '' }}
        with: { node-version: "22", cache: npm, cache-dependency-path: package-lock.json }
      - name: Authenticate npm to GitHub Packages
        if: ${{ inputs.mode == 'merge-check' && inputs.ui-package != '' && inputs.npm-github-packages }}
        working-directory: ${{ github.workspace }}
        run: echo "//npm.pkg.github.com/:_authToken=${CI_TOKEN}" >> ~/.npmrc
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
      - name: Install UI dependencies
        if: ${{ inputs.mode == 'merge-check' && inputs.ui-package != '' }}
        working-directory: ${{ github.workspace }}
        run: npm ci ${{ inputs.node-ci-flags }}
      - name: Build UI package
        if: ${{ inputs.mode == 'merge-check' && inputs.ui-package != '' }}
        working-directory: ${{ github.workspace }}
        run: npm run -w ${{ inputs.ui-package }} build
      - name: Build embedded frontend
        if: ${{ inputs.mode == 'merge-check' && inputs.ui-package != '' && inputs.frontend-build }}
        working-directory: ${{ github.workspace }}
        run: npm run -w web build
      - name: Typecheck UI package
        if: ${{ inputs.mode == 'merge-check' && inputs.ui-package != '' }}
        continue-on-error: ${{ inputs.test-soft-fail }}
        working-directory: ${{ github.workspace }}/${{ inputs.ui-package }}
        run: npx tsc --noEmit
      # -timeout is explicit because Go's default is 600s PER PACKAGE, and a
      # package that outgrows it fails with a stack dump that reads like a
      # deadlock rather than a slow suite. A green run here is otherwise only
      # evidence that this runner happened to be fast enough — margin, not
      # configuration. Raise `test-timeout` for a slow suite; do not remove it.
      - name: Test
        if: ${{ inputs.mode != 'merge-check' }}
        run: go test -race -cover -timeout ${{ inputs.test-timeout }} ./...

  # Runs only when the UI change area changed (or a file in no area), and only
  # for a caller with a `ui-package`. Never in `merge-check` mode, where the
  # `go` job builds and typechecks the UI package itself.
  ui:
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' && inputs.ui-package != '' && inputs.mode != 'merge-check' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.ui-timeout-minutes }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: package-lock.json }
      # GitHub Packages refuses even public-package installs without a token, so
      # a caller whose lockfile pulls anything from npm.pkg.github.com (e.g. the
      # @knkcms scope) 401s on a bare `npm ci`. Opting in writes ONLY the
      # credential, and to the runner's user-level ~/.npmrc — the scope→registry
      # mapping belongs in the caller's committed .npmrc, where the caller
      # decides which scopes resolve to GitHub Packages; without that mapping
      # this token is simply never consulted. Same credential shape knkcms/core's
      # repo-local CI writes. The token reaches the script via `env:` rather than
      # ${{ }} interpolation (publish-ui.yml's pattern for NODE_AUTH_TOKEN):
      # interpolating would paste the secret into the rendered script itself.
      - name: Authenticate npm to GitHub Packages
        if: ${{ inputs.npm-github-packages }}
        run: echo "//npm.pkg.github.com/:_authToken=${CI_TOKEN}" >> ~/.npmrc
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
      - run: npm ci ${{ inputs.node-ci-flags }}
      # Each workspace's OWN `lint` / `test` script, never a root-level
      # `npx biome check .`: a repo whose packages each declare their own
      # biome.json has no root config, and biome aborts on "Found a nested root
      # configuration" having checked nothing — a green step that linted zero
      # files. Calling the package script also keeps ONE definition of what
      # linting or testing a package means, shared with the local `make lint`,
      # so CI and a developer's machine cannot drift apart.
      #
      # The consequence for a caller: opting in REQUIRES the covered workspaces
      # to declare the script. `npm run -w <ws> <script>` fails on a missing one,
      # deliberately — a gate that skips what it cannot find is the gate these
      # inputs replace (knkCS/taskhub#163: a job that built and never tested,
      # while a doc claimed a translation-parity test broke the build).
      #
      # The two gates deliberately cover DIFFERENT workspaces, which is taskhub's
      # split rather than an oversight. Linting is per package — every workspace
      # has a style to hold — so `ui-lint` covers `ui-package` plus `web` when
      # `frontend-build` is on, `frontend-build` being this workflow's existing
      # signal that the repo has an embedded `web` workspace this job owns.
      # Testing is not: the real UI is `ui-package`, an embedded `web` host is a
      # thin shell, and both reference repos reflect that — taskhub's `web` has no
      # `test` script at all, while messengerhub tests its shell in a bespoke job
      # of its own. So `ui-test` covers `ui-package` alone; a repo wanting its
      # shell's suite in CI keeps it beside the shared call, the way messengerhub
      # already keeps `collisions` there.
      #
      # These run before the builds, as taskhub's job does: lint and test are the
      # cheap signals and should not queue behind a Vite build. That assumes a
      # suite resolving the package from SOURCE (both reference repos alias it in
      # their vitest config); a suite needing the built `dist/` is the reason to
      # revisit the order.
      - name: Lint UI package
        if: ${{ inputs.ui-lint }}
        run: npm run -w ${{ inputs.ui-package }} lint
      - name: Lint embedded frontend
        if: ${{ inputs.ui-lint && inputs.frontend-build }}
        run: npm run -w web lint
      - name: Test UI package
        if: ${{ inputs.ui-test }}
        run: npm run -w ${{ inputs.ui-package }} test
      - name: Build UI package
        run: npm run -w ${{ inputs.ui-package }} build
      - name: Build embedded frontend
        if: ${{ inputs.frontend-build }}
        run: npm run -w web build
      - name: Typecheck UI package
        working-directory: ${{ inputs.ui-package }}
        run: npx tsc --noEmit

  # The suite verdict: the one check a branch-protection rule should require.
  # `always()` makes it run — and report — whatever happened above, including
  # a cancelled run; a required check that is skipped would read as passing.
  # Green only if every job it needs succeeded or was skipped (by change
  # detection or an unset input); a failed or cancelled job turns it red, and
  # so does a job skipped because one it needed failed, since that failure is
  # in the same `needs` context. Logic in scripts/suite-verdict.sh, tested by
  # tests/change-areas/run.sh. A new job in this workflow MUST be added here.
  # In `merge-check` mode it is the merge check's verdict too (`go` ran as the
  # merge check, `ui` skipped): green only if the merge check passed.
  ci-ok:
    needs: [changes, go, ui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          repository: knkcs/workflows
          ref: ${{ job.workflow_sha || 'v1' }}
          path: .knkcs-workflows
          sparse-checkout: scripts
      - name: Suite verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .knkcs-workflows/scripts/suite-verdict.sh <<<"$NEEDS"
