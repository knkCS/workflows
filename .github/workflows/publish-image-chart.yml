name: Publish image and chart
on:
  workflow_call:
    inputs:
      chart-path: { type: string, required: true }    # e.g. charts/statushub
      chart-name: { type: string, required: true }    # e.g. statushub
      version:    { type: string, required: true }    # e.g. 1.2.3 (no leading v)
      ref:        { type: string, required: false, default: '' }  # git ref to build from (defaults to the triggering commit)
      build-timeout-minutes: { type: number, default: 30 }  # per native build leg; `merge` is fixed at 10
    secrets:
      CI_TOKEN: { required: true }

permissions:
  contents: read
  packages: write

jobs:
  # Build each architecture on its own NATIVE standard runner (no QEMU emulation)
  # and push by digest. amd64 -> ubuntu-latest, arm64 -> ubuntu-24.04-arm. Both
  # are standard GitHub-hosted runners, so they draw from the plan's included
  # minutes on private repos. GHA layer cache (scoped per arch) keeps repeat
  # builds fast.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    # One output key per matrix leg; each leg writes only its own key, and the
    # runner drops empty-string outputs, so the legs cannot clobber each other.
    # Digests travel as job outputs, NOT artifacts: artifact storage counts
    # against the org-wide Actions quota and quota exhaustion blocked releases.
    outputs:
      digest-amd64: ${{ steps.digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Compute refs
        id: vars
        run: |
          {
            echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "arch=$(echo '${{ matrix.platform }}' | cut -d/ -f2)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # CI_TOKEN is a BuildKit secret (id=ci_token), never a build-arg, so
          # the PAT cannot land in image layers or `docker history`.
          secrets: |
            ci_token=${{ secrets.CI_TOKEN }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.vars.outputs.date }}
          cache-from: type=gha,scope=${{ steps.vars.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.vars.outputs.arch }}
          outputs: type=image,name=${{ steps.vars.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        id: digest
        run: echo "digest-${{ steps.vars.outputs.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # Assemble the per-arch digests into a single multi-arch manifest under the
  # release tags, then publish the Helm chart once.
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Validate digests
        run: |
          test -n "${{ needs.build.outputs.digest-amd64 }}" || { echo "missing amd64 digest"; exit 1; }
          test -n "${{ needs.build.outputs.digest-arm64 }}" || { echo "missing arm64 digest"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute refs
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Create multi-arch manifest (version + latest)
        run: |
          docker buildx imagetools create \
            -t ${{ steps.vars.outputs.image }}:${{ inputs.version }} \
            -t ${{ steps.vars.outputs.image }}:latest \
            ${{ steps.vars.outputs.image }}@${{ needs.build.outputs.digest-amd64 }} \
            ${{ steps.vars.outputs.image }}@${{ needs.build.outputs.digest-arm64 }}
      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ steps.vars.outputs.image }}:${{ inputs.version }}
      - uses: azure/setup-helm@v5
      - name: Package and push chart
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          OWNER=${{ steps.vars.outputs.owner }}
          # Align the chart version with the released app version.
          helm package ${{ inputs.chart-path }} --version "${{ inputs.version }}" --app-version "${{ inputs.version }}"
          helm push "${{ inputs.chart-name }}-${{ inputs.version }}.tgz" "oci://ghcr.io/${OWNER}/charts"
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/charts/${{ inputs.chart-name }}:latest" \
            "ghcr.io/${OWNER}/charts/${{ inputs.chart-name }}:${{ inputs.version }}"
