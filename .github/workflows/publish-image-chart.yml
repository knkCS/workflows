name: Publish image and chart
on:
  workflow_call:
    inputs:
      chart-path: { type: string, required: true }    # e.g. charts/statushub
      chart-name: { type: string, required: true }    # e.g. statushub
      version:    { type: string, required: true }    # e.g. 1.2.3 (no leading v)
      platforms:  { type: string, default: "linux/amd64,linux/arm64" }
    secrets:
      CI_TOKEN: { required: true }

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compute lowercase refs
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms }}
          # CI_TOKEN is passed as a BuildKit secret (id=ci_token), never a build-arg,
          # so the PAT cannot land in image layers or `docker history`. The Dockerfile
          # consumes it via `--mount=type=secret,id=ci_token`.
          secrets: |
            ci_token=${{ secrets.CI_TOKEN }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.vars.outputs.date }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ inputs.version }}
            ${{ steps.vars.outputs.image }}:latest
      - uses: azure/setup-helm@v5
      - name: Package and push chart
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          OWNER=${{ steps.vars.outputs.owner }}
          # Align the chart version with the released app version.
          helm package ${{ inputs.chart-path }} --version "${{ inputs.version }}" --app-version "${{ inputs.version }}"
          helm push "${{ inputs.chart-name }}-${{ inputs.version }}.tgz" "oci://ghcr.io/${OWNER}/charts"
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/charts/${{ inputs.chart-name }}:latest" \
            "ghcr.io/${OWNER}/charts/${{ inputs.chart-name }}:${{ inputs.version }}"
