name: Self-test
# Repo-local CI: this repo's reusable workflows are consumed by every other
# repo's CI, but nothing exercised THEM on their own PRs — a broken engine
# script or workflow would land silently and only fail in a caller. This
# workflow runs on PRs that touch a workflow, a script or a test:
#
# - `actionlint` lints every workflow in .github/workflows/ (expressions, input
#   types, runner labels, and — via the runner's shellcheck — `run:` scripts).
# - `workflow-timeouts` (tests/workflow-timeouts/run.sh) proves every job
#   declares `timeout-minutes` with the agreed defaults, so no job can run to
#   GitHub's 6-hour limit again.
# - `rendering-check` (tests/rendering-check/run.sh) proves the
#   argocd-rendering-check engine GREEN on a correct deploy-repo fixture and RED
#   (exit code inverted in the script) on a missing value file and on a
#   schema-breaking values typo. It is hermetic: the remote chart sources are a
#   throwaway local git repo and a localhost Helm repository — no tokens, no
#   external network beyond tool installs.
# - `change-areas` (tests/change-areas/run.sh) pins every rule of the
#   change-area classifier behind go-service-ci's `changes` job — above all the
#   conservative one, a file in no known area turns on every area — and the
#   suite verdict behind its `ci-ok` job (green on pass/skipped, red on
#   failure/cancelled).
# - `docs-only-suite`, `go-only-suite`, `services-suite`, `ui-only-suite` and
#   `image-only-suite` call go-service-ci from THIS commit (local path), each
#   with a fixed change set from its test-only `test-changed-files` input, and
#   `suites-check` reads the run's job list back to prove each ran exactly what
#   its change areas need: docs-only runs none of `go`, `ui` and `image`,
#   Go-only runs `go` alone (in both test modes, and with `image-check` on),
#   UI-only runs `ui` alone, image-only runs `image` alone — and `changes` and
#   `ci-ok` are green in every one. The jobs that do run are real: the Go
#   fixtures under tests/go-service-ci/ are modules in subdirectories
#   (`working-directory`), one of whose tests needs the `services` containers,
#   the UI fixture is a workspace of the root package.json, and the image
#   fixture is a Dockerfile that fails unless built for amd64 with the
#   `ci_token` BuildKit secret.
#
# Every job runs on every matching PR: the checks are cheap, and a path filter
# per job would be one more place for a real check to be skipped.
on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actionlint.yaml
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  workflow-timeouts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Ensure PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
      - name: Check every job declares its timeout
        run: bash tests/workflow-timeouts/run.sh

  rendering-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: bash scripts/install-kubeconform.sh
      - name: Ensure PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
      - name: Run rendering-check self-test
        run: bash tests/rendering-check/run.sh

  change-areas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run change-area classifier and suite verdict self-test
        run: bash tests/change-areas/run.sh

  # The PR suite end to end: go-service-ci called from THIS commit (local
  # path) with five fixed change sets (its test-only `test-changed-files`
  # input, since this PR's own files are none of them), and `suites-check`
  # reading the run's job list back to prove which jobs ran and which were
  # skipped. The fixtures under tests/go-service-ci/ make every job that SHOULD
  # run a real one: a Go module in a subdirectory (so `working-directory` is
  # exercised), a Go module whose test needs the `services` containers, a
  # UI workspace hanging from the root package.json, and a Dockerfile (so
  # `image-context` is exercised).
  docs-only-suite:
    uses: ./.github/workflows/go-service-ci.yml
    with:
      test-changed-files: |
        README.md
        CONTEXT.md
        docs/adr/0004-example.md
        .scratch/notes.txt
        .release-please-manifest.json
      # Paths that do not exist, so a wrongly-run job fails as well as being
      # caught by suites-check.
      ui-package: packages/does-not-exist
      helm-chart: charts/does-not-exist
      working-directory: does-not-exist
    secrets:
      CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # never used: no job that reads it may run

  # Go-only, testcontainers mode (no service containers — their images resolve
  # to empty, which the runner skips). The change set leans on the caller's
  # layout: the module's testdata and the chart are Go only because they sit
  # under `working-directory` and `helm-chart`. `ui-package` and
  # `image-context` are the real fixtures, with `image-check` on, so the `ui`
  # and `image` jobs WOULD pass if they wrongly ran; suites-check is what
  # catches that — a Go change must not build the image.
  go-only-suite:
    uses: ./.github/workflows/go-service-ci.yml
    with:
      test-changed-files: |
        internal/service/service.go
        go.sum
        api/v1/service.proto
        tests/go-service-ci/go-module/testdata/case.json
        tests/rendering-check/fixtures/demo-chart/values.yaml
      go-version-file: tests/go-service-ci/go-module/go.mod
      working-directory: tests/go-service-ci/go-module
      helm-chart: tests/rendering-check/fixtures/demo-chart
      check-ent-drift: false
      check-gofmt: true
      embed-frontend: true
      ui-package: tests/go-service-ci/ui-package
      image-check: true
      image-context: tests/go-service-ci/image
    secrets:
      CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # read access to this public repo is all the Go job needs

  # Go-only again, in `services` mode: the fixture's one test fails unless
  # Postgres and Redis are listening, so a green `go` job proves the service
  # containers started.
  services-suite:
    uses: ./.github/workflows/go-service-ci.yml
    with:
      test-changed-files: |
        internal/store/store.go
      test-mode: services
      go-version-file: tests/go-service-ci/go-services-module/go.mod
      working-directory: tests/go-service-ci/go-services-module
      check-ent-drift: false
    secrets:
      CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # UI-only, with every UI gate on. The UI package is outside packages/, so
  # its source file is UI only because it is the caller's `ui-package`.
  # `working-directory` is the real Go fixture, so the `go` job WOULD pass if
  # it wrongly ran; suites-check is what catches that.
  ui-only-suite:
    uses: ./.github/workflows/go-service-ci.yml
    with:
      test-changed-files: |
        packages/app-ui/src/App.tsx
        package-lock.json
        tests/go-service-ci/ui-package/src/index.ts
      ui-package: tests/go-service-ci/ui-package
      ui-lint: true
      ui-test: true
      go-version-file: tests/go-service-ci/go-module/go.mod
      working-directory: tests/go-service-ci/go-module
      check-ent-drift: false
    secrets:
      CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # never used: npm-github-packages is off and the Go job must not run

  # Image-only, with `image-check` on: the `image` job builds the fixture
  # Dockerfile, which fails unless it is built for linux/amd64 with a
  # non-empty `ci_token` BuildKit secret, so a green `image` job proves both.
  # `working-directory` and `ui-package` are the real fixtures, so the `go` and
  # `ui` jobs WOULD pass if they wrongly ran; suites-check is what catches that.
  image-only-suite:
    uses: ./.github/workflows/go-service-ci.yml
    with:
      test-changed-files: |
        Dockerfile
        .dockerignore
        docker/entrypoint.sh
        tests/go-service-ci/image/Dockerfile
      image-check: true
      image-context: tests/go-service-ci/image
      go-version-file: tests/go-service-ci/go-module/go.mod
      working-directory: tests/go-service-ci/go-module
      check-ent-drift: false
      ui-package: tests/go-service-ci/ui-package
    secrets:
      CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # the fixture only checks the secret arrives non-empty

  suites-check:
    needs: [docs-only-suite, go-only-suite, services-suite, ui-only-suite, image-only-suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Each change set ran exactly the jobs its change areas need
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
        run: |
          set -euo pipefail
          jobs=$(gh api --paginate "$JOBS_URL" --jq '.jobs[] | select(.name | test("-suite / ")) | "\(.name)=\(.conclusion)"' | sort)
          printf '%s\n\n' "$jobs"
          # One line per job, "<suite> / <job>=<conclusion>". Every suite must
          # run `changes` and `ci-ok`, both green; the rest is per change set.
          want=$(printf '%s\n' \
            'docs-only-suite / changes=success' \
            'docs-only-suite / go=skipped' \
            'docs-only-suite / ui=skipped' \
            'docs-only-suite / image=skipped' \
            'docs-only-suite / ci-ok=success' \
            'go-only-suite / changes=success' \
            'go-only-suite / go=success' \
            'go-only-suite / ui=skipped' \
            'go-only-suite / image=skipped' \
            'go-only-suite / ci-ok=success' \
            'services-suite / changes=success' \
            'services-suite / go=success' \
            'services-suite / ui=skipped' \
            'services-suite / image=skipped' \
            'services-suite / ci-ok=success' \
            'ui-only-suite / changes=success' \
            'ui-only-suite / go=skipped' \
            'ui-only-suite / ui=success' \
            'ui-only-suite / image=skipped' \
            'ui-only-suite / ci-ok=success' \
            'image-only-suite / changes=success' \
            'image-only-suite / go=skipped' \
            'image-only-suite / ui=skipped' \
            'image-only-suite / image=success' \
            'image-only-suite / ci-ok=success' | sort)
          if [ "$jobs" != "$want" ]; then
            echo "::error::a change set ran the wrong jobs; want:"
            printf '%s\n\n' "$want"
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$jobs") || true
            exit 1
          fi
