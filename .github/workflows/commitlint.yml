name: Commitlint
on:
  workflow_call:

# pull-requests: read is needed so the action can list the PR's commits via API.
# The CALLER must also grant it (a reusable workflow cannot exceed caller perms).
permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Write conventional-commits config
        # wagoid/commitlint-github-action rejects a .js configFile — it must be
        # .mjs (ESM) or .cjs. Use .mjs with an ESM default export.
        run: |
          echo 'export default { extends: ["@commitlint/config-conventional"] };' > commitlint.config.mjs
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
