# Publish an npm workspace package to a configurable npm registry.
#
# Defaults reproduce the original public-npm behavior exactly: registry
# https://registry.npmjs.org, `npm publish --access public`, auth via the
# NPM_TOKEN secret. Callers that pass NPM_TOKEN (directly or via
# `secrets: inherit`) and no new inputs are unaffected.
#
# To publish to GitHub Packages instead:
#   - set `registry-url: https://npm.pkg.github.com`
#   - grant the calling workflow (or job) `packages: write`
#   - pass no NPM_TOKEN: without the secret, auth falls back to the workflow's
#     own GitHub token, which a reusable workflow receives without any secret
#     being passed
#   - scope caveat: setup-node maps the calling repo's OWNER scope to the
#     GitHub Packages registry, so the package must be scoped @<owner> (a
#     package scoped otherwise needs its own publishConfig)
# `--access public` is sent to every registry except GitHub Packages, where
# package visibility is governed by org/repo settings, not the flag.
#
# A lockfile that pulls packages from GitHub Packages (e.g. the @knkcms
# scope) needs `npm-github-packages: true` and the CI_TOKEN secret (with
# read:packages): `npm ci` then reads the runner's ~/.npmrc, holding only the
# CI_TOKEN credential for npm.pkg.github.com. setup-node runs first WITHOUT
# `registry-url` — with it, setup-node points NPM_CONFIG_USERCONFIG at its own
# npmrc and npm would never read ~/.npmrc — and the publish registry is set up
# only after the credential is removed again, right before `npm publish`. So
# CI_TOKEN is in neither the npmrc nor the environment `npm publish` sees, and
# NPM_TOKEN stays the only credential for public npm. The scope→registry
# mapping belongs in the caller's committed .npmrc, credential-free.
#
# `dry-run: true` runs everything but publishes nothing (`npm publish
# --dry-run`): the self-test uses it. Callers leave it off.
#
# Note: this workflow requests `packages: write`, and a called workflow may
# not request more than its caller allows — so a caller that restricts
# GITHUB_TOKEN permissions must grant `packages: write` even when publishing
# to public npm.
name: Publish UI package
on:
  workflow_call:
    inputs:
      package-dir:   { type: string, required: true }   # e.g. packages/statushub-ui
      tag-name:      { type: string, required: true }   # e.g. statushub-ui-v1.2.3
      tag-prefix:    { type: string, required: true }   # e.g. statushub-ui-v
      # Git ref to build and publish from; empty means the triggering commit,
      # as before. A release passes its tag (the same value as `tag-name`), so
      # the package is built from the commit that was released, not whichever
      # later commit the run happens to be for.
      ref:           { type: string, default: "" }      # e.g. statushub-ui-v1.2.3
      build-script:  { type: string, default: "build:ui" }
      test-script:   { type: string, default: "test:ui" }
      node-ci-flags: { type: string, default: "" }
      registry-url:  { type: string, default: "https://registry.npmjs.org" }  # e.g. https://npm.pkg.github.com
      ui-timeout-minutes: { type: number, default: 15 }  # job timeout: install, build, test and publish
      npm-github-packages: { type: boolean, default: false }  # authenticate `npm ci` to npm.pkg.github.com with CI_TOKEN
      dry-run:       { type: boolean, default: false }  # `npm publish --dry-run`: publishes nothing (the self-test's switch)
    secrets:
      # Auth for `npm publish`. Optional: when absent, the workflow's GitHub
      # token is used — sufficient for GitHub Packages, never for public npm.
      NPM_TOKEN: { required: false }
      # read:packages on GitHub Packages, for `npm ci` only and only with
      # `npm-github-packages`; never sent to the publish registry.
      CI_TOKEN: { required: false }

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.ui-timeout-minutes }}
    env:
      # The secrets context is not allowed in a step-level `if`; hoist the
      # presence test here, where it is.
      NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
      CI_TOKEN_SET: ${{ secrets.CI_TOKEN != '' }}
    steps:
      # Fail fast on a tokenless publish to anywhere but GitHub Packages:
      # github.token is useless off GitHub and would otherwise be sent to the
      # registry only to fail with a late 401. Skipped whenever NPM_TOKEN is
      # passed, so existing callers never see it run.
      - name: Refuse tokenless publish outside GitHub Packages
        if: ${{ !contains(inputs.registry-url, 'npm.pkg.github.com') && env.NPM_TOKEN_SET == 'false' }}
        run: |
          echo "::error::NPM_TOKEN is required when registry-url is not GitHub Packages"
          exit 1
      - name: Refuse npm-github-packages without CI_TOKEN
        if: ${{ inputs.npm-github-packages && env.CI_TOKEN_SET == 'false' }}
        run: |
          echo "::error::npm-github-packages needs the CI_TOKEN secret (read:packages on GitHub Packages)"
          exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      # With npm-github-packages, no registry-url here: it would point
      # NPM_CONFIG_USERCONFIG at setup-node's npmrc, and `npm ci` would never
      # read the credential in ~/.npmrc. The publish registry is then set up
      # by the second setup-node below. Without the input — every existing
      # caller — this step is exactly what it always was.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: ${{ !inputs.npm-github-packages && inputs.registry-url || '' }}
          cache: npm
          cache-dependency-path: package-lock.json
      # Only the credential, as go-service-ci's `ui` job writes it; the token
      # reaches the script via `env:`, never ${{ }} interpolation into it.
      - name: Authenticate npm to GitHub Packages
        if: ${{ inputs.npm-github-packages }}
        run: echo "//npm.pkg.github.com/:_authToken=${CI_TOKEN}" >> ~/.npmrc
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
      - run: npm ci ${{ inputs.node-ci-flags }}
      - name: Verify version matches tag
        working-directory: ${{ inputs.package-dir }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ inputs.tag-name }}"
          TAG_VERSION="${TAG_VERSION#${{ inputs.tag-prefix }}}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: Build
        run: npm run ${{ inputs.build-script }}
      - name: Test
        run: npm run ${{ inputs.test-script }}
      # Belt and braces: the npmrc the next step writes already replaces
      # ~/.npmrc for every later npm command, but the credential has done its
      # job, so it goes before anything is published.
      - name: Remove the GitHub Packages credential
        if: ${{ inputs.npm-github-packages }}
        run: sed -i '\|^//npm\.pkg\.github\.com/:_authToken=|d' ~/.npmrc
      # The publish registry's npmrc (NODE_AUTH_TOKEN, i.e. NPM_TOKEN), which
      # the first setup-node left out for npm-github-packages.
      - uses: actions/setup-node@v4
        if: ${{ inputs.npm-github-packages }}
        with:
          node-version: "22"
          registry-url: ${{ inputs.registry-url }}
      - name: Publish
        working-directory: ${{ inputs.package-dir }}
        # GitHub Packages must not be sent `--access public` (access is decided
        # by org/repo settings there); every other registry keeps today's flag.
        # `cond && flag || ''` (not `cond && '' || flag`): an empty-string
        # middle operand is falsy and would make the expression always yield
        # the flag.
        run: npm publish ${{ !contains(inputs.registry-url, 'npm.pkg.github.com') && '--access public' || '' }} ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || github.token }}
